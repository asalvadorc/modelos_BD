<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">La mínima se escribe en el extremo opuesto</title>
  <desc id="desc">Desde EMPLEADO se lee el par (1,1) junto a DEPARTAMENTO, al otro lado de PERTENECE. El primer 1, destacado en rojo, indica que todo empleado debe pertenecer al menos a un departamento. El segundo 1 indica como máximo uno.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#d32f2f" stroke-width="2"/></marker>
  </defs>
  <rect width="1000" height="320" rx="12" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#18332f" text-anchor="middle">
    <text x="500" y="34" font-size="23" font-weight="700">¿A cuántos departamentos debe pertenecer un empleado?</text>
    <text x="165" y="78" font-size="17" font-weight="700">Partimos de EMPLEADO</text>
    <path d="M165 91 V108 H648 V129" fill="none" stroke="#d32f2f" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="430" y="94" font-size="16" fill="#d32f2f">Leemos en el extremo opuesto</text>
    <g fill="white" stroke="#344744" stroke-width="2">
      <rect x="55" y="160" width="220" height="60" rx="4" fill="#f3f8f7"/>
      <path d="M500 146 L580 190 L500 234 L420 190 Z"/>
      <rect x="725" y="160" width="220" height="60" rx="4"/>
      <path d="M275 190 H420 M580 190 H725" fill="none"/>
    </g>
    <g font-size="19">
      <text x="165" y="197">EMPLEADO</text>
      <text x="500" y="196" font-size="17">PERTENECE</text>
      <text x="835" y="197">DEPARTAMENTO</text>
      <text x="340" y="175">(0,N)</text>
    </g>
    <rect x="610" y="135" width="83" height="44" rx="8" fill="#fff0f0" stroke="#d32f2f"/>
    <text x="651" y="165" font-size="25">(<tspan fill="#d32f2f" font-weight="700">1</tspan>,1)</text>
    <text x="500" y="271" font-size="21" font-weight="700" fill="#d32f2f">Mínima 1: ningún EMPLEADO puede quedar sin DEPARTAMENTO.</text>
    <text x="500" y="300" font-size="17">El par (1,1) junto a DEPARTAMENTO significa: al menos uno y como máximo uno.</text>
  </g>
</svg>
