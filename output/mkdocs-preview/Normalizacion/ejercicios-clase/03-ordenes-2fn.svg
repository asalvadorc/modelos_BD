<title id="title">Líneas de pedido · Grafo en 2FN</title><desc id="desc">Los datos del cliente todavía están en ORDEN: id_orden → id_cliente → nom_cliente, ciudad. Las claves están en recuadros. Cada flecha es independiente y los atributos de destino no tienen recuadro.</desc>
