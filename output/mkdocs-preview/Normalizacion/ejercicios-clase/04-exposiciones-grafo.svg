<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">Exposiciones: grafo después de separar las fechas</title>
<desc id="desc">La clave es codexp y codobr. codexp determina fecha_inicio, fecha_fin y codgal. codgal determina nomgal, dirgal, cpgal y ciugal. codobr determina nomobr, tip, dim y codaut. codaut determina nomaut.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f4fb0" /></marker></defs>
<rect width="1120" height="760" rx="16" fill="white" />
<g font-family="Segoe UI,Arial,sans-serif" fill="#172554" text-anchor="middle">
<text x="560" y="36" font-size="25" font-weight="700">Exposiciones · Grafo tras aplicar la 1FN</text>
<text x="560" y="67" font-size="18">El período se separa en fecha_inicio y fecha_fin.</text>
<rect x="30" y="100" width="245" height="610" rx="14" fill="#e9eff9" stroke="#2f4fb0" stroke-width="3" />
<text x="152" y="132" font-size="19" font-weight="700">Clave principal</text>
<text x="152" y="240" font-size="26" font-weight="700">codexp</text>
<text x="152" y="532" font-size="26" font-weight="700">codobr</text>
<text x="427.0" y="141" font-size="22" text-anchor="start">fecha_inicio</text><path d="M205 219 L413 134" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="427.0" y="213" font-size="22" text-anchor="start">fecha_fin</text><path d="M205 231 L413 206" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="427.0" y="309" font-size="22" text-anchor="start">codgal</text><path d="M205 243 L413 302" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="857.0" y="189" font-size="22" text-anchor="start">nomgal</text><path d="M504.469 287.96 L845 181.96" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="857.0" y="261" font-size="22" text-anchor="start">dirgal</text><path d="M504.469 297.293 L845 253.96" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="857.0" y="333" font-size="22" text-anchor="start">cpgal</text><path d="M504.469 306.627 L845 325.96" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="857.0" y="405" font-size="22" text-anchor="start">ciugal</text><path d="M504.469 315.96 L845 397.96" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="427.0" y="479" font-size="22" text-anchor="start">nomobr</text><path d="M205 509 L413 472" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="427.0" y="551" font-size="22" text-anchor="start">tip</text><path d="M205 518.333 L413 544" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="427.0" y="623" font-size="22" text-anchor="start">dim</text><path d="M205 527.667 L413 616" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="427.0" y="695" font-size="22" text-anchor="start">codaut</text><path d="M205 537 L413 688" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="857.0" y="695" font-size="22" text-anchor="start">nomaut</text><path d="M506.094 687.96 L845 687.96" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /></g></svg>