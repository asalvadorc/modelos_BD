<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="706" viewBox="0 0 1350 706" role="img" aria-labelledby="title desc">
<title id="title">Ejercicio 3: diagrama relacional de las tablas</title>
<desc id="desc">Tablas CLIENTE, ORDEN, ARTICULO, DETALLE_ORDEN. PK indica clave primaria y FK clave externa. Las flechas van desde la clave externa a la clave primaria referenciada; los corchetes agrupan las claves compuestas.</desc>
