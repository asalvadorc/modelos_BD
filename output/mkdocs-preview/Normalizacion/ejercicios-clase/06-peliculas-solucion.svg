<text x="760" y="640" font-size="22">Sin atributos adicionales</text><text x="760" y="677" font-size="18">Una fila por película, año y actor.</text>
<text x="530" y="735" font-size="17">FK: (titulo, anyo) → PELICULA(titulo, anyo)</text></g></svg>