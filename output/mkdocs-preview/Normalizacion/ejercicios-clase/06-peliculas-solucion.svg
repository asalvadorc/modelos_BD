<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="766" viewBox="0 0 1060 766" role="img" aria-labelledby="title desc">
<title id="title">Películas: solución en 3FN</title>
<desc id="desc">Tablas normalizadas con claves primarias en recuadros azules, dependencias funcionales mediante flechas y claves externas al pie de cada tabla.</desc>
