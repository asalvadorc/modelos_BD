<rect x="576" y="134" width="420" height="36" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="786" y="159" font-size="21">ciudadestudio</text><path d="M364 172.0H470V152H574" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530" y="250" font-size="17">Cada estudio está ubicado en una sola ciudad.</text>
<rect x="20" y="288" width="1020" height="256" rx="12" fill="#f8faff" stroke="#d8e1f1"/><text x="530" y="316" font-size="22" font-weight="700">PELICULA</text>
