<text x="204" y="396.0" font-size="24" font-weight="700">titulo</text>
<text x="204" y="424.0" font-size="24" font-weight="700">anyo</text>
<rect x="576" y="336" width="420" height="36" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="786" y="361" font-size="21">duracion</text><path d="M364 402.0H470V354H574" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="576" y="380" width="420" height="36" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="786" y="405" font-size="21">tipo</text><path d="M364 402.0H470V398H574" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="576" y="424" width="420" height="36" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="786" y="449" font-size="21">estudio (FK)</text><path d="M364 402.0H470V442H574" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="530" y="522" font-size="17">FK: estudio → ESTUDIO(estudio)</text>
<rect x="20" y="560" width="1020" height="192" rx="12" fill="#f8faff" stroke="#d8e1f1"/><text x="530" y="588" font-size="22" font-weight="700">REPARTO</text>
<rect x="44" y="603.0" width="320" height="86" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5"/>
<text x="204" y="640.0" font-size="24" font-weight="700">titulo</text>
<text x="204" y="668.0" font-size="24" font-weight="700">actor</text>
