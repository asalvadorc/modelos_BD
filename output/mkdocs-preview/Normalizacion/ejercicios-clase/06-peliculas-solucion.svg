<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="766" viewBox="0 0 1060 766" role="img" aria-labelledby="title desc">
<title id="title">Películas: solución en 3FN</title>
<desc id="desc">Tablas normalizadas con claves primarias en recuadros azules, dependencias funcionales mediante flechas y claves externas al pie de cada tabla.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f4fb0"/></marker></defs>
<rect width="1060" height="766" rx="16" fill="white"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#172554">
<text x="530" y="36" font-size="25" font-weight="700">Películas · Solución en 3FN</text>
<text x="530" y="65" font-size="17">Recuadro azul: clave primaria · Flechas: dependencias funcionales</text>
<rect x="20" y="86" width="1020" height="186" rx="12" fill="#f8faff" stroke="#d8e1f1"/><text x="530" y="114" font-size="22" font-weight="700">ESTUDIO</text>
<rect x="44" y="129.0" width="320" height="86" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5"/>
