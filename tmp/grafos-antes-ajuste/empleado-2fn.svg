<svg xmlns="http://www.w3.org/2000/svg" width="820" height="610" viewBox="0 0 820 610" role="img" aria-labelledby="title desc">
<title id="title">Tablas del ejemplo en segunda forma normal</title>
<desc id="desc">TRABAJA: A y B determinan H. EMPLEADO: A determina C, D y E; E y F se determinan mutuamente. PROYECTO: B y G se determinan mutuamente.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f4fb0"/></marker></defs>
<rect width="820" height="610" rx="12" fill="white"/>
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#172554">
<text x="410" y="32" font-size="23" font-weight="700">Descomposición en 2FN</text>
<text x="410" y="68" font-size="21" font-weight="700">TRABAJA</text>
<rect x="40" y="85" width="230" height="70" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5"/>
<text x="155.0" y="113" font-size="24" font-weight="700">A · B</text><text x="155.0" y="138" font-size="16">DNI · Núm. proyecto</text>
<rect x="366" y="85" width="220" height="70" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/>
<text x="476.0" y="113" font-size="24" font-weight="700">H</text><text x="476.0" y="138" font-size="16">Horas semanales</text>
<path d="M270 120H364" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="410" y="207" font-size="21" font-weight="700">EMPLEADO</text>
<rect x="40" y="270" width="230" height="70" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5"/>
<text x="155.0" y="298" font-size="24" font-weight="700">A</text><text x="155.0" y="323" font-size="16">DNI</text>
<rect x="366" y="224" width="164" height="65" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/>
<text x="448.0" y="252" font-size="24" font-weight="700">C</text><text x="448.0" y="277" font-size="16">Nombre</text>
<rect x="594" y="224" width="180" height="65" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/>
<text x="684.0" y="252" font-size="24" font-weight="700">D</text><text x="684.0" y="277" font-size="16">Sueldo</text>
<rect x="366" y="344" width="164" height="65" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/>
<text x="448.0" y="372" font-size="24" font-weight="700">E</text><text x="448.0" y="397" font-size="16">Núm. dpto.</text>
<rect x="622" y="344" width="164" height="65" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/>
<text x="704.0" y="372" font-size="24" font-weight="700">F</text><text x="704.0" y="397" font-size="16">Nombre dpto.</text>
<path d="M270 305H318V256H364" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M318 256V212H570V256H592" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M318 305V376H364" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M532 376H620" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="410" y="466" font-size="21" font-weight="700">PROYECTO</text>
<rect x="40" y="484" width="230" height="70" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5"/>
<text x="155.0" y="512" font-size="24" font-weight="700">B</text><text x="155.0" y="537" font-size="16">Núm. proyecto</text>
<rect x="366" y="484" width="220" height="70" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/>
<text x="476.0" y="512" font-size="24" font-weight="700">G</text><text x="476.0" y="537" font-size="16">Nombre proyecto</text>
<path d="M272 519H364" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
