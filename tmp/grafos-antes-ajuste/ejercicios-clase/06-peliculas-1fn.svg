<rect x="510" y="150" width="225" height="54" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/><text x="622" y="185" font-size="24">duracion</text><rect x="510" y="260" width="225" height="54" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/><text x="622" y="295" font-size="24">tipo</text><rect x="510" y="370" width="225" height="54" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/><text x="622" y="405" font-size="24">estudio</text><rect x="835" y="370" width="245" height="54" rx="10" fill="white" stroke="#172554" stroke-width="2.5"/><text x="957" y="405" font-size="24">ciudadestudio</text>
