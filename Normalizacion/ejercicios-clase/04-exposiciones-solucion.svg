<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1364" viewBox="0 0 1060 1364" role="img" aria-labelledby="title desc">
<title id="title">Exposiciones: solución en tercera forma normal</title>
<desc id="desc">Cinco tablas con sus claves primarias y dependencias: GALERIA, EXPOSICION, AUTOR, OBRA y PARTICIPA. PARTICIPA solo contiene las dos claves externas que identifican la participación.</desc>
