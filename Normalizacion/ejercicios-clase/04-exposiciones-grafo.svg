<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">Exposiciones: grafo después de separar las fechas</title>
<desc id="desc">La clave es codexp y codobr. codexp determina fecha_inicio, fecha_fin y codgal. codgal determina nomgal, dirgal, cpgal y ciugal. codobr determina nomobr, tip, dim y codaut. codaut determina nomaut.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f4fb0"/></marker></defs>
<rect width="1120" height="760" rx="16" fill="white"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172554" text-anchor="middle">
<text x="560" y="36" font-size="25" font-weight="700">Exposiciones · Grafo tras aplicar la 1FN</text>
<text x="560" y="67" font-size="18">El período se separa en fecha_inicio y fecha_fin.</text>
<rect x="30" y="100" width="245" height="610" rx="14" fill="#e9eff9" stroke="#2f4fb0" stroke-width="3"/>
<text x="152" y="132" font-size="19" font-weight="700">Clave principal</text>
<text x="152" y="240" font-size="26" font-weight="700">codexp</text>
<text x="152" y="532" font-size="26" font-weight="700">codobr</text>
<rect x="415" y="112" width="220" height="44" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="525.0" y="141" font-size="22">fecha_inicio</text><path d="M205 231H330V134H413" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="184" width="220" height="44" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="525.0" y="213" font-size="22">fecha_fin</text><path d="M205 231H330V206H413" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="280" width="220" height="44" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="525.0" y="309" font-size="22">codgal</text><path d="M205 231H330V302H413" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="845" y="160" width="235" height="44" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="962.5" y="189" font-size="22">nomgal</text><path d="M635 302H735V182H843" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="845" y="232" width="235" height="44" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="962.5" y="261" font-size="22">dirgal</text><path d="M635 302H735V254H843" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="845" y="304" width="235" height="44" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="962.5" y="333" font-size="22">cpgal</text><path d="M635 302H735V326H843" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="845" y="376" width="235" height="44" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="962.5" y="405" font-size="22">ciugal</text><path d="M635 302H735V398H843" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="415" y="450" width="220" height="44" rx="8" fill="white" stroke="#172554" stroke-width="2"/><text x="525.0" y="479" font-size="22">nomobr</text><path d="M205 523H330V472H413" fi