<svg xmlns="http://www.w3.org/2000/svg" width="900" height="428" viewBox="0 0 900 428" role="img" aria-labelledby="title desc">
<title id="title">Ejercicio 9: diagrama relacional de las tablas</title>
<desc id="desc">Tablas RECETA, RECETA_INGREDIENTE. PK indica clave primaria y FK clave externa. Las flechas van desde la clave externa a la clave primaria referenciada; los corchetes agrupan las claves compuestas.</desc>
<defs><marker id="fk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2476b4"/></marker></defs>
<rect width="900" height="428" rx="12" fill="#fff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#173c37">
<text x="450.0" y="35" text-anchor="middle" font-size="26" font-weight="700">Ejercicio 9 · Diagrama relacional</text>
<text x="450.0" y="67" text-anchor="middle" font-size="18">PK: clave primaria · FK: clave externa · Flecha: FK → PK</text>
<path d="M495 256L390 186" fill="none" stroke="#2476b4" stroke-width="2.5" marker-end="url(#fk-arrow)"/>
<rect x="45" y="120" width="345" height="228" rx="8" fill="white" stroke="#537c72" stroke-width="2"/>
<path d="M53 120H382Q390 120 390 128V168H45V128Q45 120 53 120" fill="#013e37"/>
<text x="217.5" y="151" text-anchor="middle" font-size="20" font-weight="700" fill="white">RECETA</text>
<rect x="46" y="168" width="343" height="36" fill="#e8f3ed"/>
<line x1="45" y1="168" x2="390" y2="168" stroke="#d1e0db"/>
<text x="57" y="192" font-size="14" font-weight="700" fill="#2476b4">PK</text><text x="136" y="193" font-size="19" font-weight="700">Cod_Plato</text>
<line x1="45" y1="204" x2="390" y2="204" stroke="#d1e0db"/>
<text x="57" y="228" font-size="14" font-weight="700" fill="#2476b4"></text><text x="136" y="229" font-size="19">Nombre_Plato</text>
<line x1="45" y1="240" x2="390" y2="240" stroke="#d1e0db"/>
<text x="57" y="264" font-size="14" font-weight="700" fill="#2476b4"></text><text x="136" y="265" font-size="19">Cocinero</text>
<line x1="45" y1="276" x2="390" y2="276" stroke="#d1e0db"/>
<text x="57" y="300" font-size="14" font-weight="700" fill="#2476b4"></text><text x="136" y="301" font-size="19">Región</text>
<line x1="45" y1="312" x2="390" y2="312" stroke="#d1e0db"/>
<text x="57" y="336" font-size="14" font-weight="700" fill="#2476b4"></text><text x="136" y="337" font-size="19">Tipo_Plato</text>
<rect x="495" y="190" width="345" height="120" rx="8" fill="white" stroke="#537c72" stroke-width="2"/>
<path d="M503 190H832Q840 190 840 198V238H495V198Q495 190 503 190" fill="#013e37"/>
<text x="667.5" y="221" text-anchor="middle" font-size="20" font-weight="700" fill="white">RECETA_INGREDIENTE</text>
<rect x="496" y="238" width="343" height="36" fill="#e8f3ed"/>
<line x1="495" y1="238" x2="840" y2="238" stroke="#d1e0db"/>
<text x="507" y="262" font-size="14" font-weight="700" fill="#2476b4">PK / FK</text><text x="586" y="263" font-size="19" font-weight="700">Cod_Plato</text>
<rect x="496" y="274" width="343" height="36" fill="#e8f3ed"/>
<line x1="495" y1="274" x2="840" y2="274" stroke="#d1e0db"/>
<text x="507" y="298" font-size="14" font-weight="700" fill="#2476b4">PK</text><text x="586" y="299" font-size="19" font-weight="700">Ingrediente</text>
</g></svg>