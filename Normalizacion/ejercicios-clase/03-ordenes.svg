<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">Dependencias de las líneas de pedido</title><desc id="desc">Clave id_orden y num_art. id_orden determina fecha e id_cliente; id_cliente determina nom_cliente y ciudad. num_art determina nom_art y precio_art. La clave completa determina cantidad.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f4fb0" /></marker></defs>
<rect width="1120" height="660" rx="16" fill="white" />
<g font-family="Segoe UI,Arial,sans-serif" fill="#172554" text-anchor="middle">
<text x="560" y="38" font-size="26" font-weight="700">Líneas de pedido · Dependencias funcionales</text>
<rect x="30" y="90" width="255" height="500" rx="12" fill="#e9eff9" stroke="#2f4fb0" stroke-width="3" />
<text x="157" y="126" font-size="19">Clave principal</text><text x="157" y="232" font-size="27" font-weight="700">id_orden</text><text x="157" y="422" font-size="27" font-weight="700">num_art</text>
<text x="482.0" y="162" font-size="23" text-anchor="start">fecha</text><text x="482.0" y="282" font-size="23" text-anchor="start">id_cliente</text><text x="482.0" y="397" font-size="23" text-anchor="start">nom_art</text><text x="482.0" y="497" font-size="23" text-anchor="start">precio_art</text><text x="482.0" y="587" font-size="23" text-anchor="start">cantidad</text><text x="847.0" y="252" font-size="23" text-anchor="start">nom_cliente</text><text x="847.0" y="332" font-size="23" text-anchor="start">ciudad</text><path d="M218 217 L468 154" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M218 229 L468 274" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M589.328 268.64 L835 244.64" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M589.328 280.64 L835 324.64" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M218 407 L468 389" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M218 419 L468 489" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M285 579 L468 579" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="560" y="641" font-size="19">La cantidad depende de la clave completa: id_orden + num_art.</text></g></svg>