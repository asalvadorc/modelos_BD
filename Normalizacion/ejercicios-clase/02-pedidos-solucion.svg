<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1170" viewBox="0 0 1060 1170" role="img" aria-labelledby="title desc">
<title id="title">Pedidos: solución en tercera forma normal</title>
<desc id="desc">Cinco tablas: CANTIDAD, CATEGORIA, PRECIO, PRODUCTO y PEDIDOS. Cada clave primaria está dentro de un recuadro azul; las flechas indican dependencias funcionales y los pies indican las claves externas.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f4fb0" /></marker></defs>
<rect width="1060" height="1170" rx="16" fill="white" />
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#172554">
<text x="530" y="36" font-size="25" font-weight="700">Pedidos · Solución en 3FN</text>
<text x="530" y="65" font-size="17">Recuadro azul: clave primaria · Flechas: dependencias funcionales</text>
<text x="530" y="114" font-size="22" font-weight="700">CANTIDAD</text>
<rect x="44" y="130" width="320" height="96" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5" />
<text x="204" y="178.0" font-size="23" font-weight="700">IDpedido</text>
<text x="588.0" y="183" font-size="20" text-anchor="start">Cantidad</text>
<path d="M364 178 L574 176" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="530" y="250" font-size="16">La clave IDpedido determina Cantidad.</text>
<text x="530" y="328" font-size="22" font-weight="700">CATEGORIA</text>
<rect x="44" y="344" width="320" height="96" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5" />
<text x="204" y="392.0" font-size="23" font-weight="700">NombreProducto</text>
<text x="588.0" y="397" font-size="20" text-anchor="start">Categoria</text>
<path d="M364 392 L574 390" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="530" y="464" font-size="16">La clave NombreProducto determina Categoria.</text>
<text x="530" y="542" font-size="22" font-weight="700">PRECIO</text>
<rect x="44" y="558" width="320" height="96" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5" />
<text x="204" y="606.0" font-size="23" font-weight="700">IDproducto</text>
<text x="588.0" y="611" font-size="20" text-anchor="start">PrecioUnitario</text>
<path d="M364 606 L574 604" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="530" y="678" font-size="16">La clave IDproducto determina PrecioUnitario.</text>
<text x="530" y="756" font-size="22" font-weight="700">PRODUCTO</text>
<rect x="44" y="772" width="320" height="96" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5" />
<text x="204" y="806.5" font-size="23" font-weight="700">Región</text>
<text x="204" y="833.5" font-size="23" font-weight="700">IDproducto</text>
<text x="588.0" y="805" font-size="20" text-anchor="start">NombreProducto (FK)</text>
<path d="M364 809 L574 798" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="588.0" y="852" font-size="20" text-anchor="start">ImpuestoRegion</text>
<path d="M364 831 L574 845" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="530" y="892" font-size="16">FK: IDproducto → PRECIO(IDproducto)</text>
<text x="530" y="915" font-size="16">FK: NombreProducto → CATEGORIA(NombreProducto)</text>
<text x="530" y="970" font-size="22" font-weight="700">PEDIDOS</text>
<rect x="44" y="986" width="320" height="96" rx="10" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5" />
<text x="204" y="1007.0" font-size="23" font-weight="700">IDcliente</text>
<text x="204" y="1034.0" font-size="23" font-weight="700">Región</text>
<text x="204" y="1061.0" font-size="23" font-weight="700">IDproducto</text>
<text x="588.0" y="1019" font-size="20" text-anchor="start">IDpedido (FK)</text>
<path d="M364 1023 L574 1012" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="588.0" y="1066" font-size="20" text-anchor="start">FechaPedido</text>
<path d="M364 1045 L574 1059" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" />
<text x="530" y="1106" font-size="16">FK: (Región, IDproducto) → PRODUCTO(Región, IDproducto)</text>
<text x="530" y="1129" font-size="16">FK: IDpedido → CANTIDAD(IDpedido)</text>
</g></svg>