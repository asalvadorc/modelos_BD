<title id="title">Ejercicio 6: diagrama relacional de las tablas</title>
<desc id="desc">Tablas ESTUDIO, PELICULA, REPARTO. PK indica clave primaria y FK clave externa. Las flechas van desde la clave externa a la clave primaria referenciada; los corchetes agrupan las claves compuestas.</desc>
