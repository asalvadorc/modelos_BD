<g font-family="Segoe UI,Arial,sans-serif" fill="#173c37">
<text x="675.0" y="35" text-anchor="middle" font-size="26" font-weight="700">Ejercicio 5 · Diagrama relacional</text>
<text x="675.0" y="67" text-anchor="middle" font-size="18">PK: clave primaria · FK: clave externa · Flecha: FK → PK</text>
