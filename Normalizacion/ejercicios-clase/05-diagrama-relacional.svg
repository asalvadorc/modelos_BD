<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="410" viewBox="0 0 1350 410" role="img" aria-labelledby="title desc">
<title id="title">Ejercicio 5: diagrama relacional de las tablas</title>
<desc id="desc">Tablas PUESTO, TRABAJADOR, EMAIL_TRABAJADOR. PK indica clave primaria y FK clave externa. Las flechas van desde la clave externa a la clave primaria referenciada; los corchetes agrupan las claves compuestas.</desc>
<defs><marker id="fk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2476b4"/></marker></defs>
