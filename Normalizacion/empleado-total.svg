<rect width="920" height="320" rx="12" fill="white" />
<g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle" fill="#172554">
<text x="460" y="34" font-size="24" font-weight="700">Dependencia total</text>
<rect x="28" y="58" width="330" height="196" rx="12" fill="#e9eff9" stroke="#2f4fb0" stroke-width="3" />
<text x="193" y="89" font-size="18">Clave principal compuesta</text>
<text x="193" y="141" font-size="26" font-weight="700">A · DNI</text>
<text x="193" y="215" font-size="26" font-weight="700">B · Núm. proyecto</text>
<text x="750" y="145" font-size="26" font-weight="700">H</text><text x="750" y="180" font-size="21">Horas semanales</text>
<path d="M358 156 L608 156" fill="none" stroke="#2f4fb0" stroke-width="2.8" marker-end="url(#arrow)" /><text x="460" y="295" font-size="20">La flecha sale del recuadro: se necesita la clave completa.</text></g></svg>