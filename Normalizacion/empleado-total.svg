<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
<title id="title">Dependencia total</title><desc id="desc">Clave compuesta A, DNI, y B, número de proyecto. La flecha sale del recuadro: se necesita la clave completa.</desc>
