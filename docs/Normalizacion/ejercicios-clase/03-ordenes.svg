<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">Dependencias de las líneas de pedido</title><desc id="desc">Clave id_orden y num_art. id_orden determina fecha e id_cliente; id_cliente determina nom_cliente y ciudad. num_art determina nom_art y precio_art. La clave completa determina cantidad.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f4fb0"/></marker></defs>
<rect width="1120" height="660" rx="16" fill="white"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172554" text-anchor="middle">
<text x="560" y="38" font-size="26" font-weight="700">Líneas de pedido · Dependencias funcionales</text>
<rect x="30" y="90" width="255" height="500" rx="12" fill="#e9eff9" stroke="#2f4fb0" stroke-width="3"/>
<text x="157" y="126" font-size="19">Clave principal</text><text x="157" y="232" font-size="27" font-weight="700">id_orden</text><text x="157" y="422" font-size="27" font-weight="700">num_art</text>
<rect x="470" y="130" width="230" height="48" rx="9" fill="white" stroke="#172554" stroke-width="2.5"/><text x="585.0" y="162" font-size="23">fecha</text><rect x="470" y="250" width="230" height="48" rx="9" fill="white" stroke="#172554" stroke-width="2.5"/><text x="585.0" y="282" font-size="23">id_cliente</text><rect x="470" y="365" width="230" height="48" rx="9" fill="white" stroke="#172554" stroke-width="2.5"/><text x="585.0" y="397" font-size="23">nom_art</text><rect x="470" y="465" width="230" height="48" rx="9" fill="white" stroke="#172554" stroke-width="2.5"/><text x="585.0" y="497" font-size="23">precio_art</text><rect x="470" y="555" width="230" height="48" rx="9" fill="white" stroke="#172554" stroke-width="2.5"/><text x="585.0" y="587" font-size="23">cantidad</text><rect x="835" y="220" width="245" height="48" rx="9" fill="white" stroke="#172554" stroke-width="2.5"/><text x="957.5" y="252" font-size="23">nom_cliente</text><rect x="835" y="300" width="245" height="48" rx="9" fill="white" stroke="#172554" stroke-width="2.5"/><text x="957.5" y="332" font-size="23">ciudad</text><path d="M218 223H365V154H468" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M365 223V274H468" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 274H760V244H833" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M760 274V324H833" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M218 413H365V389H468" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M365 413V489H468" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M285 579H468" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="560" y="641" font-size="19">La cantidad depende de la clave completa: id_orden + num_art.</text></g></svg>