<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" aria-labelledby="title desc">
<title id="title">Ejercicio 7: diagrama relacional de las tablas</title>
<desc id="desc">Tablas ALUMNO, CURSO, MATRICULA. PK indica clave primaria y FK clave externa. Las flechas van desde la clave externa a la clave primaria referenciada; los corchetes agrupan las claves compuestas.</desc>
