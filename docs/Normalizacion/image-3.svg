<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="680" viewBox="0 0 1300 680" role="img" aria-labelledby="title desc">
<title id="title">Cómo leer un grafo de dependencias funcionales</title>
<desc id="desc">La clave A, B y O está en un recuadro continuo. B y O están agrupados en un recuadro discontinuo. La clave completa determina M y S; A determina Q; O determina C; B y O determinan R; M determina N y P. Se explica cada elemento con seis llamadas numeradas.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f4fb0"/></marker></defs>
<rect width="1300" height="680" rx="16" fill="white"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172554">
<text x="650" y="40" text-anchor="middle" font-size="27" font-weight="700">Estructura del grafo · Clave principal: A · B · O</text>
<rect x="40" y="85" width="230" height="510" rx="12" fill="#e9eff9" stroke="#2f4fb0" stroke-width="3"/>
<rect x="100" y="320" width="110" height="230" rx="8" fill="none" stroke="#2f4fb0" stroke-width="2.5" stroke-dasharray="8 6"/>
<g text-anchor="middle" font-size="34" font-weight="700">
<text x="155" y="245">A</text><text x="155" y="385">B</text><text x="155" y="490">O</text>
<text x="455" y="145">M</text><text x="455" y="245">Q</text><text x="455" y="335">S</text><text x="455" y="440">C</text><text x="455" y="545">R</text>
<text x="630" y="145">N</text><text x="630" y="215">P</text>
</g>
<g fill="none" stroke="#2f4fb0" stroke-width="2.8" marker-end="url(#arrow)">
<path d="M270 133H426"/><path d="M177 233H426"/>
<path d="M270 323H426"/><path d="M177 478L426 428"/>
<path d="M210 533H426"/><path d="M478 133H602"/><path d="M478 145L602 203"/>
</g>
<text x="350" y="116" text-anchor="middle" font-size="17">A · B · O</text>
<text x="350" y="307" text-anchor="middle" font-size="17">A · B · O</text>
<text x="320" y="566" text-anchor="middle" font-size="17">B · O</text>
<text x="350" y="642" text-anchor="middle" font-size="19">Las letras son atributos; los recuadros agrupan determinantes.</text>
<circle cx="735" cy="94" r="18" fill="#2f4fb0"/><text x="735" y="101" text-anchor="middle" font-size="21" font-weight="700" fill="white">1</text><text x="768" y="100" font-size="22" font-weight="700">Recuadro exterior continuo</text><text x="768" y="129" font-size="19">Contiene la clave principal completa: A · B · O.</text><circle cx="735" cy="187" r="18" fill="#2f4fb0"/><text x="735" y="194" text-anchor="middle" font-size="21" font-weight="700" fill="white">2</text><text x="768" y="193" font-size="22" font-weight="700">Recuadro interior discontinuo</text><text x="768" y="222" font-size="19">Agrupa B · O: una parte de la clave.</text><circle cx="735" cy="280" r="18" fill="#2f4fb0"/><text x="735" y="287" text-anchor="middle" font-size="21" font-weight="700" fill="white">3</text><text x="768" y="286" font-size="22" font-weight="700">Salida del recuadro exterior</text><text x="768" y="315" font-size="19">A · B · O → M y A · B · O → S.</text><text x="768" y="341" font-size="19">La dependencia usa toda la clave.</text><circle cx="735" cy="385" r="18" fill="#2f4fb0"/><text x="735" y="392" text-anchor="middle" font-size="21" font-weight="700" fill="white">4</text><text x="768" y="391" font-size="22" font-weight="700">Salida de un atributo interior</text><text x="768" y="420" font-size="19">A → Q y O → C.</text><text x="768" y="446" font-size="19">Dependencias parciales.</text><circle cx="735" cy="490" r="18" fill="#2f4fb0"/><text x="735" y="497" text-anchor="middle" font-size="21" font-weight="700" fill="white">5</text><text x="768" y="496" font-size="22" font-weight="700">Salida del recuadro interior</text><text x="768" y="525" font-size="19">B · O → R: depende de ambos juntos.</text><text x="768" y="551" font-size="19">Es parcial respecto a A · B · O.</text><circle cx="735" cy="595" r="18" fill="#2f4fb0"/><text x="735" y="602" text-anchor="middle" font-size="21" font-weight="700" fill="white">6</text><text x="768" y="601" font-size="22" font-weight="700">Flechas entre atributos exteriores</text><text x="768" y="630" font-size="19">M → N y M → P.</text><text x="768" y="656" font-size="19">Forman cadenas transitivas desde la clave.</text><circle cx="41" cy="83" r="14" fill="white" stroke="#2f4fb0" stroke-width="2"/><text x="41" y="89" text-anchor="middle" font-size="17" font-weight="700">1</text><circle cx="100" cy="320" r="14" fill="white" stroke="#2f4fb0" stroke-width="2"/><text x="100" y="326" text-anchor="middle" font-size="17" font-weight="700">2</text><circle cx="306" cy="160" r="14" fill="white" stroke="#2f4fb0" stroke-width="2"/><text x="306" y="166" text-anchor="middle" font-size="17" font-weight="700">3</text><circle cx="306" cy="260" r="14" fill="white" stroke="#2f4fb0" stroke-width="2"/><text x="306" y="266" text-anchor="middle" font-size="17" font-weight="700">4</text><circle cx="306" cy="505" r="14" fill="white" stroke="#2f4fb0" stroke-width="2"/><text x="306" y="511" text-anchor="middle" font-size="17" font-weight="700">5</text><circle cx="554" cy="104" r="14" fill="white" stroke="#2f4fb0" stroke-width="2"/><text x="554" y="110" text-anchor="middle" font-size="17" font-weight="700">6</text></g></svg>