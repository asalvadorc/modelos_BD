<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="780" viewBox="0 0 1050 780" role="img" aria-labelledby="title desc">
<title id="title">Descomposición de EMPLEADO en 2FN</title><desc id="desc">TRABAJA: A y B determinan H. EMPLEADO: tres flechas separadas desde A hacia C, D y E; E y F se determinan mutuamente. PROYECTO: B y G se determinan mutuamente. Solo las claves principales están dentro de recuadros.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f4fb0"/></marker></defs>
<rect width="1050" height="780" rx="16" fill="white"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172554" text-anchor="middle">
<text x="525" y="36" font-size="26" font-weight="700">Descomposición en 2FN</text>
<text x="525" y="83" font-size="23" font-weight="700">TRABAJA</text>
<rect x="40" y="108" width="255" height="90" rx="12" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5"/>
<text x="167" y="143" font-size="26" font-weight="700">A · B</text><text x="167" y="176" font-size="18">DNI · Núm. proyecto</text>
<text x="525" y="143" font-size="26" font-weight="700">H</text><text x="525" y="176" font-size="18">Horas semanales</text>
<path d="M295 152L450 152" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="525" y="251" font-size="23" font-weight="700">EMPLEADO</text>
<rect x="40" y="320" width="255" height="130" rx="12" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5"/>
<text x="167" y="374" font-size="26" font-weight="700">A</text><text x="167" y="407" font-size="18">DNI</text>
<text x="525" y="304" font-size="26" font-weight="700">C</text><text x="525" y="337" font-size="18">Nombre</text>
<text x="525" y="394" font-size="26" font-weight="700">D</text><text x="525" y="427" font-size="18">Sueldo</text>
<text x="525" y="484" font-size="26" font-weight="700">E</text><text x="525" y="517" font-size="18">Núm. dpto.</text>
<text x="865" y="484" font-size="26" font-weight="700">F</text><text x="865" y="517" font-size="18">Nombre dpto.</text>
<g fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M295 345L450 312"/><path d="M295 385L450 402"/><path d="M295 425L450 492"/>
<path d="M548 476L842 476" marker-start="url(#arrow)"/>
</g>
<text x="525" y="589" font-size="23" font-weight="700">PROYECTO</text>
<rect x="40" y="613" width="255" height="90" rx="12" fill="#e9eff9" stroke="#2f4fb0" stroke-width="2.5"/>
<text x="167" y="648" font-size="26" font-weight="700">B</text><text x="167" y="681" font-size="18">Núm. proyecto</text>
<text x="525" y="648" font-size="26" font-weight="700">G</text><text x="525" y="681" font-size="18">Nombre proyecto</text>
<path d="M297 657L450 657" fill="none" stroke="#2f4fb0" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="525" y="752" font-size="18">La dependencia entre E y F permanece hasta aplicar la 3FN.</text></g></svg>